# Machine / distro / build basics
MACHINE ??= "imx6qrsb4411a1"
DISTRO ?= "fsl-imx-x11"
UBOOT_CONFIG ?= "1G"
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
CONF_VERSION = "2"

# Download / sstate dirs
DL_DIR ?= "${BSPDIR}/downloads/"
ACCEPT_FSL_EULA = "1"

# Packaging / image features
PACKAGE_CLASSES = "package_deb"
EXTRA_IMAGE_FEATURES:append = " package-management "

# Disk monitor thresholds
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

# IMAGE name
IMAGE_NAME = "YoctianOS-DEV-image"

# Essential packages: apt (optional repo), sudo, systemd, firstboot helper
IMAGE_INSTALL:append = " \
    apt apt-utils \
    sudo \
    systemd \
    systemd-firstboot \
"

# Ensure systemd is used as init
VIRTUAL-RUNTIME_init = "systemd"

# Inject first-boot script + optional APT repo and OS identity files at image creation
ROOTFS_POSTPROCESS_COMMAND += "add_firstboot_and_repo;"

add_firstboot_and_repo() {
    # create directories in the image rootfs
    mkdir -p ${IMAGE_ROOTFS}/usr/local/sbin
    mkdir -p ${IMAGE_ROOTFS}/etc/systemd/system
    mkdir -p ${IMAGE_ROOTFS}/etc/systemd/system/multi-user.target.wants
    mkdir -p ${IMAGE_ROOTFS}/etc/apt/sources.list.d
    mkdir -p ${IMAGE_ROOTFS}/etc/apt/trusted.gpg.d

    # /etc/os-release (YoctianOS DEV)
    cat > ${IMAGE_ROOTFS}/etc/os-release <<'EOF'
NAME="YoctianOS DEV"
VERSION="DEV"
ID=yoctianos
PRETTY_NAME="YoctianOS DEV"
HOME_URL="https://github.com/YoctianOS"
EOF
    chmod 0644 ${IMAGE_ROOTFS}/etc/os-release

    # /etc/hostname (default)
    cat > ${IMAGE_ROOTFS}/etc/hostname <<'EOF'
yoctianos
EOF
    chmod 0644 ${IMAGE_ROOTFS}/etc/hostname

    # /etc/issue (login banner)
    cat > ${IMAGE_ROOTFS}/etc/issue <<'EOF'
YoctianOS DEV \n \l
EOF
    chmod 0644 ${IMAGE_ROOTFS}/etc/issue

    # /etc/lsb-release (compatibility)
    cat > ${IMAGE_ROOTFS}/etc/lsb-release <<'EOF'
DISTRIB_ID=YoctianOS
DISTRIB_RELEASE=DEV
DISTRIB_DESCRIPTION="A Linux Embedded Distro"
EOF
    chmod 0644 ${IMAGE_ROOTFS}/etc/lsb-release

    # firstboot-user.sh : interactive script executed at first boot
    cat > ${IMAGE_ROOTFS}/usr/local/sbin/firstboot-user.sh <<'EOF'
#!/bin/sh
set -e

echo
echo "=== YoctianOS first boot setup ==="

# Hostname (optional)
printf "Hostname (leave empty to keep 'yoctianos'): "
read NEWHOST
if [ -n "$NEWHOST" ]; then
    echo "$NEWHOST" > /etc/hostname
    hostname "$NEWHOST" || true
fi

# Username prompt
while true; do
    printf "Username: "
    read USER
    if [ -n "$USER" ]; then break; fi
done

# Password prompt (twice)
while true; do
    stty -echo
    printf "Password: "
    read PASS
    echo
    printf "Confirm password: "
    read PASS2
    echo
    stty echo
    if [ "$PASS" = "$PASS2" ] && [ -n "$PASS" ]; then
        break
    else
        echo "Passwords do not match or are empty. Try again."
    fi
done

# Create user and set password
useradd -m -s /bin/bash "$USER" || exit 1
echo "${USER}:${PASS}" | chpasswd

# Grant sudo (create sudoers entry if no sudo group)
if getent group sudo >/dev/null 2>&1; then
    usermod -a -G sudo "$USER"
else
    echo "${USER} ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-${USER}
    chmod 0440 /etc/sudoers.d/99-${USER}
fi

# Optional: ask for an APT repository URL and add it (leave empty to skip)
printf "APT repo URL (leave empty to skip): "
read APTURL
if [ -n "$APTURL" ]; then
    # detect architecture if dpkg is available
    ARCH=""
    if command -v dpkg >/dev/null 2>&1; then
        ARCH="$(dpkg --print-architecture 2>/dev/null || true)"
    fi
    if [ -n "$ARCH" ]; then
        echo "deb [arch=${ARCH}] ${APTURL} ./" > /etc/apt/sources.list.d/yoctianos.list
    else
        echo "deb ${APTURL} ./" > /etc/apt/sources.list.d/yoctianos.list
    fi
    chmod 0644 /etc/apt/sources.list.d/yoctianos.list

    # If you baked a GPG key into the image at build time (BSPDIR/files/yoctianos.gpg),
    # it will be present in /etc/apt/trusted.gpg.d/ and apt will verify signatures.
    # Attempt an apt-get update (best-effort; requires network)
    if command -v apt-get >/dev/null 2>&1; then
        apt-get update || true
    fi
fi

# Disable this service so it won't run again
systemctl disable firstboot-user.service || true

echo "First boot setup complete. User '${USER}' created."
EOF
    chmod 0755 ${IMAGE_ROOTFS}/usr/local/sbin/firstboot-user.sh

    # systemd unit: firstboot-user.service
    cat > ${IMAGE_ROOTFS}/etc/systemd/system/firstboot-user.service <<'EOF'
[Unit]
Description=YoctianOS first boot user setup
ConditionFirstBoot=yes
After=network-online.target

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/firstboot-user.sh
StandardInput=tty
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF
    chmod 0644 ${IMAGE_ROOTFS}/etc/systemd/system/firstboot-user.service

    # enable the service by creating the symlink in multi-user.target.wants
    ln -sf /etc/systemd/system/firstboot-user.service ${IMAGE_ROOTFS}/etc/systemd/system/multi-user.target.wants/firstboot-user.service
}
