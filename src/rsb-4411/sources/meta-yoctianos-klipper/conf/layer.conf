# Layer root
LAYERDIR := "${@os.path.normpath(os.path.dirname(d.getVar('FILE', True)) + '/..')}"

# Add the layer root to BBPATH
BBPATH .= ":${LAYERDIR}"

# Layer metadata
LAYERVERSION = "1"

# Collection and pattern (match the entire layer)
BBFILE_COLLECTIONS += "meta-yoctianos-klipper"
BBFILE_PATTERN_meta-yoctianos-klipper := "^${LAYERDIR}/"

# Dependencies and priority
LAYERDEPENDS_meta-yoctianos-klipper = "core"
BBFILE_PRIORITY_meta-yoctianos-klipper = "6"

# Yocto compatibility
LAYERSERIES_COMPAT_meta-yoctianos-klipper = "mickledore"
