PREMIRRORS_prepend = "\
  http://.*/.* https://deb.debian.org/debian/ \n \
  http://.*/.* http://mirror.csclub.uwaterloo.ca/debian/ \n \
  http://.*/.* http://ftp.fr.debian.org/debian/ \n \
"

MIRRORS_prepend = "\
  http://.*/.* https://deb.debian.org/debian/ \n \
  http://.*/.* http://mirror.csclub.uwaterloo.ca/debian/ \n \
  http://.*/.* http://ftp.fr.debian.org/debian/ \n \
"

# Layer root
LAYERDIR := "${@os.path.normpath(os.path.dirname(d.getVar('FILE', True)) + '/..')}"

# Add the layer root to BBPATH
BBPATH .= ":${LAYERDIR}"

# Layer metadata
LAYERVERSION = "1"

# Collection and pattern (match the entire layer)
BBFILE_COLLECTIONS += "meta-yoctianos"
BBFILE_PATTERN_meta-yoctianos := "^${LAYERDIR}/"

# Dependencies and priority
LAYERDEPENDS_meta-yoctianos = "core"
BBFILE_PRIORITY_meta-yoctianos = "6"

# Yocto compatibility
LAYERSERIES_COMPAT_meta-yoctianos = "mickledore"
