# Layer root
LAYERDIR := "${@os.path.normpath(os.path.dirname(d.getVar('FILE', True)) + '/..')}"

# Add the layer root to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# Layer metadata
LAYERVERSION = "1"

# Collection name and file patterns (search recipes under the layer root)
BBFILE_COLLECTIONS += "meta-yoctianos"
BBFILE_PATTERN_meta-yoctianos := "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend ${LAYERDIR}/classes/*.bbclass"

# Optional: dependencies on other layers (space separated)
LAYERDEPENDS_meta-yoctianos = "core"

# Priority (optional)
LAYER_PRIORITY_meta-yoctianos = "6"

# Declare compatibility with Yocto Mickledore
LAYERSERIES_COMPAT_meta-yoctianos = "mickledore"
