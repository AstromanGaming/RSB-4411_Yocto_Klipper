# Layer metadata
BBPATH := "${BBPATH}:${LAYERDIR}"
LAYERDIR := "${@os.path.dirname(d.getVar('FILE', True))}"

# A short name for the layer
LAYERVERSION = "1"

# Collections and patterns
BBFILE_COLLECTIONS += "meta-yoctianos"
BBFILE_PATTERN_meta-yoctianos := "${LAYERDIR}/recipes-*/*/*.bb \
                                  ${LAYERDIR}/recipes-*/*/*.bbappend \
                                  ${LAYERDIR}/classes/*.bbclass"

# Optional: dependencies on other layers (comma separated)
LAYERDEPENDS_meta-yoctianos = "core"

# Priority (optional)
LAYER_PRIORITY_meta-yoctianos = "6"
